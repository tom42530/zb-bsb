; ============================================================================
; ZB-BSB — Passerelle Zigbee 3.0 autonome pour Pompe à Chaleur BSB
; Cible : Seeed Studio XIAO ESP32-C6 (RISC-V + Radio IEEE 802.15.4 native)
; Architecture : Zéro dépendance BSB externe (pile BSB C++ écrite de zéro)
; ============================================================================

[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Table de partitions Zigbee Router (inclut nvs, zb_storage et zb_fct)
board_build.partitions = zigbee_zczr.csv

; On utilise directement le SDK officiel esp-zigbee-sdk (ESP-IDF) sans la
; surcouche Arduino Zigbee limitée, pour permettre l'enregistrement dynamique
; des Endpoints/Clusters après l'Auto-Discovery BSB.
lib_ignore =
    Zigbee

build_flags =
    -DZIGBEE_MODE_ZCZR
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; ============================================================================
; Configuration Zigbee OTA (Over-The-Air) & Generation automatique (.ota + index.json)
; ============================================================================
extra_scripts = scripts/build_ota.py
custom_ota_version      = 0x01010000
custom_ota_manufacturer = 0x131B
custom_ota_image_type   = 0x0001
custom_ota_hw_version   = 0x0001
custom_ota_base_url     = https://github.com/tom42530/zb-bsb/releases/latest/download

; ============================================================================
; Environnement de Tests Unitaires Natifs (PC / GitHub Actions CI)
; Commande : pio test -e native
; ============================================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
lib_compat_mode = off
