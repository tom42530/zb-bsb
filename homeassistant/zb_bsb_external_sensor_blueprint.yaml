blueprint:
  name: "ZB-BSB — Associer une Sonde de Température Externe à un Thermostat (Zone 1 ou Zone 2)"
  description: >
    Ce Blueprint permet de sélectionner graphiquement dans Home Assistant n'importe quelle sonde de température
    (Zigbee, Bluetooth, Matter, Wi-Fi, Netatmo, etc. — ex: `sensor.thermometre_temperature`) pour alimenter
    la température ambiante d'un Thermostat ZB-BSB (Zone 1 ou Zone 2) et la diffuser automatiquement sur le bus BSB
    de la pompe à chaleur.
  domain: automation
  input:
    external_temp_sensor:
      name: "Sonde de température d'ambiance externe (Home Assistant)"
      description: "Choisissez le capteur de température de la pièce (ex: sensor.thermometre_temperature)."
      selector:
        entity:
          domain: sensor
          device_class: temperature
    target_zb_bsb_number:
      name: "Entité 'Sonde Temp. Externe Zone 1 / Zone 2' du ZB-BSB"
      description: >
        Sélectionnez l'entité `number` exposée par ZB-BSB correspondant à la zone souhaitée
        (Endpoint 3 pour Zone 1, Endpoint 4 pour Zone 2).
      selector:
        entity:
          domain: number
    max_age_minutes:
      name: "Âge maximal de la mesure (minutes)"
      description: >
        Si la sonde n'a plus donné signe de vie depuis plus longtemps que cette durée (pile vide, capteur hors
        de portée), sa dernière valeur n'est plus retransmise. Sans rafraîchissement pendant 30 minutes, le
        ZB-BSB revient alors de lui-même sur la mesure du régulateur. Augmentez cette durée pour une sonde qui
        ne publie que rarement lorsque la température est stable.
      default: 180
      selector:
        number:
          min: 15
          max: 1440
          unit_of_measurement: min
          mode: box

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input external_temp_sensor
  - platform: time_pattern
    minutes: "/10"
  - platform: homeassistant
    event: start
  # Le ZB-BSB vient de redémarrer (ou a désactivé la sonde faute de nouvelles) : l'entité repasse à 0,
  # ou revient d'indisponible. La température est renvoyée aussitôt, sans attendre le rappel périodique.
  # Pour couper volontairement la sonde externe, désactivez cette automatisation puis réglez l'entité sur 0.
  - platform: state
    entity_id: !input target_zb_bsb_number
    to: "0.0"
  - platform: state
    entity_id: !input target_zb_bsb_number
    from: "unavailable"

variables:
  sensor_entity: !input external_temp_sensor
  max_age_minutes: !input max_age_minutes
  raw_state: "{{ states(sensor_entity) }}"

condition:
  # La valeur doit être numérique, plausible ET récente : le rappel périodique (toutes les 10 minutes) ne
  # doit pas maintenir « en vie » une sonde morte dont Home Assistant conserve simplement le dernier état.
  - condition: template
    value_template: >
      {% set s = states[sensor_entity] %}
      {% set seen = (s.last_reported | default(s.last_updated)) if s is not none else none %}
      {{ raw_state not in ['unknown', 'unavailable', 'none', '']
         and (raw_state | float(-99)) >= 5.0
         and (raw_state | float(-99)) <= 35.0
         and seen is not none
         and (now() - seen).total_seconds() <= (max_age_minutes | int(180)) * 60 }}

action:
  - service: number.set_value
    target:
      entity_id: !input target_zb_bsb_number
    data:
      value: "{{ (states(sensor_entity) | float) | round(1) }}"
